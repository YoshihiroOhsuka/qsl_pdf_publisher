services:
  qsl-pdf-generator:
    build: ./
    container_name: 'qsl-pdf-generator'
    tty: true
    working_dir: /work
    command: >
      /bin/bash -c "poetry run python qsl_pdf_publisher/app.py &&
      tail -f /dev/null"
    volumes:
      - ./:/work

  test:
    build: ./
    container_name: 'qsl-pdf-generator-test'
    working_dir: /work
    command: poetry run pytest -v --cov=qsl_pdf_publisher
    volumes:
      - ./:/work
